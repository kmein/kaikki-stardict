name: release
on:
  push:
    branches: [master]
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Build dictionaries
        run: nix develop --command make --jobs=4
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest > /dev/null 2>&1; then
            gh release delete latest --cleanup-tag --yes
          fi
          gh release create latest --prerelease --target "$GITHUB_SHA" --title "Dictionary release" --notes "Built from kaikki.org data on $(date -u +%F)." ./*.zip
